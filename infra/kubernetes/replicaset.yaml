apiVersion: apps/v1
kind: ReplicaSet
metadata:
  name: fraud-detection-api-rs-reference
  namespace: fraud-detection
  labels:
    app: fraud-detection-api
    managed-by: deployment-reference
spec:
  replicas: 3
  selector:
    matchLabels:
      app: fraud-detection-api
      tier: api-reference
  template:
    metadata:
      labels:
        app: fraud-detection-api
        tier: api-reference
    spec:
      containers:
        - name: api
          image: fraud-detection-api:latest
          ports:
            - containerPort: 8000
