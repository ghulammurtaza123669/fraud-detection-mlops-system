<svg xmlns="http://www.w3.org/2000/svg" width="980" height="520" viewBox="0 0 980 520" role="img" aria-labelledby="title desc">
  <title id="title">Fraud Detection Model Metrics Graph</title>
  <desc id="desc">Bar chart showing accuracy, F1 score, ROC AUC, and average precision for the fraud detection model.</desc>
  <rect width="980" height="520" fill="#f6f8fb"/>
  <rect x="54" y="44" width="872" height="420" rx="14" fill="#ffffff" stroke="#d9e1ee"/>
  <text x="86" y="92" fill="#101828" font-family="Arial, sans-serif" font-size="30" font-weight="700">Fraud Detection Model Performance</text>
  <text x="86" y="124" fill="#667085" font-family="Arial, sans-serif" font-size="16">Random Forest evaluation metrics from the trained model</text>
  <line x1="132" y1="392" x2="862" y2="392" stroke="#344054" stroke-width="2"/>
  <line x1="132" y1="162" x2="132" y2="392" stroke="#344054" stroke-width="2"/>
  <g fill="#98a2b3" font-family="Arial, sans-serif" font-size="13">
    <text x="96" y="396">0.0</text>
    <text x="96" y="342">0.2</text>
    <text x="96" y="296">0.4</text>
    <text x="96" y="250">0.6</text>
    <text x="96" y="204">0.8</text>
    <text x="96" y="166">1.0</text>
  </g>
  <g stroke="#eef2f7">
    <line x1="132" y1="346" x2="862" y2="346"/>
    <line x1="132" y1="300" x2="862" y2="300"/>
    <line x1="132" y1="254" x2="862" y2="254"/>
    <line x1="132" y1="208" x2="862" y2="208"/>
    <line x1="132" y1="162" x2="862" y2="162"/>
  </g>
  <rect x="190" y="179" width="98" height="213" rx="8" fill="#126782"/>
  <rect x="360" y="211" width="98" height="181" rx="8" fill="#2cb1bc"/>
  <rect x="530" y="169" width="98" height="223" rx="8" fill="#147a50"/>
  <rect x="700" y="202" width="98" height="190" rx="8" fill="#b86b00"/>
  <g fill="#101828" font-family="Arial, sans-serif" text-anchor="middle">
    <text x="239" y="166" font-size="18" font-weight="700">0.924</text>
    <text x="409" y="198" font-size="18" font-weight="700">0.787</text>
    <text x="579" y="156" font-size="18" font-weight="700">0.972</text>
    <text x="749" y="189" font-size="18" font-weight="700">0.824</text>
    <text x="239" y="426" font-size="16">Accuracy</text>
    <text x="409" y="426" font-size="16">F1 Score</text>
    <text x="579" y="426" font-size="16">ROC AUC</text>
    <text x="749" y="426" font-size="16">Avg Precision</text>
  </g>
</svg>
